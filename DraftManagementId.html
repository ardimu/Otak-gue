<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef2ec; --sheet: #ffffff; --ink: #1d2a25; --muted: #5d6b65;
    --rule: #d2dcd1; --accent: #1f5c46; --accent-soft: #e2eee8;
    --danger: #a8322a; --danger-soft: #f8e6e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px; background: var(--paper); color: var(--ink);
    font: 13px/1.45 "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .count { color: var(--muted); font-size: 11px; }
  input[type=search] {
    flex: 1; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 3px;
    font: inherit; background: var(--sheet);
  }
  input[type=date] {
    padding: 9px 11px; border: 1px solid var(--rule); border-radius: 3px;
    font: inherit; background: var(--sheet); width: auto;
  }
  #exportExcel { margin-left: auto; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    border: 1px solid transparent; border-radius: 3px; padding: 7px 12px;
    font: inherit; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .ghost { background: var(--sheet); border-color: var(--rule); color: var(--ink); }
  .edit { background: var(--sheet); border-color: var(--accent); color: var(--accent); }
  .post { background: var(--accent); color: #fff; }
  .del { background: var(--sheet); border-color: var(--danger); color: var(--danger); }
  .wrap {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px;
    overflow: auto; max-height: 440px;
  }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th {
    position: sticky; top: 0; background: #f4f7f3; text-align: left; font-weight: 600;
    padding: 9px 10px; border-bottom: 1px solid var(--rule);
  }
  td { padding: 9px 10px; border-bottom: 1px solid #e8eee7; vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .empty { text-align: center; padding: 34px; color: var(--muted); }
  #status { margin-top: 10px; color: var(--muted); min-height: 18px; }
  #status.error { color: var(--danger); }
  .overlay {
    position: fixed; inset: 0; background: rgba(20, 30, 26, .45);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .dialog { width: 100%; max-width: 420px; background: var(--sheet); border-radius: 4px; padding: 20px; }
  .dialog h2 { margin: 0 0 8px; font-size: 16px; }
  .dialog p { margin: 0; color: var(--muted); white-space: pre-wrap; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Manajemen Draf</h1>
<div class="sub">Draf tidak dimasukkan ke Buku Besar dan laporan keuangan hingga diposting.</div>

<div class="toolbar">
  <input type="search" id="search" placeholder="Cari berdasarkan ID Jurnal, keterangan, atau referensi">
  <input type="date" id="startDate" aria-label="Tanggal mulai">
  <input type="date" id="endDate" aria-label="Tanggal akhir">
  <button class="ghost" id="prevPage">Sebelumnya</button>
  <span class="count" id="pageInfo"></span>
  <button class="ghost" id="nextPage">Berikutnya</button>
  <button class="ghost" id="refresh">Muat Ulang</button>
  <button class="ghost" id="checkStatus">Cek Status</button>
  <button class="ghost hidden" id="stopPost">Hentikan</button>
  <button class="post" id="postAll">Posting Semua</button>
  <button class="edit" id="exportExcel" type="button">Ekspor Excel</button>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>ID Jurnal</th><th>Tanggal</th><th>Keterangan</th><th class="num">Baris</th>
        <th class="num">Debet</th><th class="num">Kredit</th><th>Terakhir Diperbarui</th><th>Aksi</th>
      </tr>
    </thead>
    <tbody id="body"><tr><td colspan="8" class="empty">Memuat draf...</td></tr></tbody>
  </table>
</div>
<div id="status"></div>

<div id="overlay" class="overlay hidden">
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <div class="row">
      <button class="ghost" id="dlgCancel">Batal</button>
      <button class="post" id="dlgOk">Konfirmasi</button>
    </div>
  </div>
</div>

<?!= include('scriptId.js'); ?>
<script>
  let drafts = [];
  let busy = false;
  let pending = null;
  let failedFilter = null;
  let stats = { total: 0, debit: 0, credit: 0, review: 0 };
  let page = 1;
  let totalPages = 1;
  let postToken = '';
  let postTotal = 0;
  let postIds = [];
  let postPosted = [];
  let postFailures = [];
  const $ = id => document.getElementById(id);

  const fmt = n => Number(n || 0).toLocaleString('id-ID');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function setStatus(text, isError) {
    $('status').textContent = text;
    $('status').className = isError ? 'error' : '';
  }

  function setBusy(value) {
    busy = value;
    document.querySelectorAll('button').forEach(b => {
      if (b.id !== 'stopPost' && b.id !== 'checkStatus') b.disabled = value;
    });
  }

  function requestDraftList(extra) {
    return Object.assign({
      search: $('search').value, startDate: $('startDate').value, endDate: $('endDate').value,
      failedIds: failedFilter || [], page: page, pageSize: 50
    }, extra || {});
  }

  function load() {
    setStatus('Memuat draf...');
    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success) { setStatus(res && res.message || 'Gagal memuat draf.', true); return; }
        drafts = res.drafts || [];
        stats = res.stats || stats;
        page = Number(res.page) || 1;
        totalPages = Number(res.totalPages) || 1;
        render();
        setStatus((res.total || 0) + ' draf.');
      })
      .withFailureHandler(e => setStatus('Gagal memuat draf: ' + e.message, true))
      .getDraftList(requestDraftList());
  }

  function render() {
    const list = drafts;
    $('pageInfo').textContent = page + ' / ' + totalPages;
    $('prevPage').disabled = page <= 1;
    $('nextPage').disabled = page >= totalPages;
    if (!list.length) {
      $('body').innerHTML = '<tr><td colspan="8" class="empty">' +
        (stats.total ? 'Tidak ada draf yang sesuai dengan pencarian.' : 'Belum ada draf. Simpan jurnal sebagai Draf untuk melihatnya di sini.') +
        '</td></tr>';
      return;
    }
    $('body').innerHTML = list.map(d => `
      <tr>
        <td><strong>${esc(d.journalId)}</strong></td>
        <td>${esc(d.date)}</td>
        <td>${esc(d.description)}<div class="sub" style="margin:0">${esc(d.journalType)}</div></td>
        <td class="num">${d.lineCount}</td>
        <td class="num">${fmt(d.debit)}</td>
        <td class="num">${fmt(d.credit)}</td>
        <td>${esc(d.updatedAt)}</td>
        <td><div class="actions">
          <button class="edit" data-act="edit" data-id="${esc(d.journalId)}">Ubah</button>
          <button class="post" data-act="post" data-id="${esc(d.journalId)}">Posting</button>
          <button class="del" data-act="delete" data-id="${esc(d.journalId)}">Hapus</button>
        </div></td>
      </tr>`).join('');
  }

  function ask(title, body, okLabel, onOk, cancelLabel, hideCancel) {
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body;
    $('dlgOk').textContent = okLabel;
    $('dlgCancel').textContent = cancelLabel || 'Batal';
    $('dlgCancel').classList.toggle('hidden', !!hideCancel);
    pending = onOk;
    $('overlay').classList.remove('hidden');
  }
  function missingPartyBody(count, details) {
    return count + ' transaksi' + (count === 1 ? ' tanpa' : ' tanpa') + ' Pelanggan / Pemasok yang ditentukan. Transaksi tersebut tetap dapat diposting ke Buku Besar, tetapi tidak akan muncul dalam buku besar Pelanggan / Pemasok. Apakah Anda ingin melanjutkan?' +
      (details && details.length ? '\n\n' + details.join('\n') : '');
  }
  function closeAsk() { $('overlay').classList.add('hidden'); pending = null; }
  $('dlgCancel').addEventListener('click', closeAsk);
  $('dlgOk').addEventListener('click', () => { const fn = pending; closeAsk(); if (fn) fn(); });

  function run(label, serverFn, id) {
    setBusy(true);
    setStatus(label);
    google.script.run
      .withSuccessHandler(r => { setBusy(false); setStatus(r && r.message ? r.message : 'Selesai.'); load(); })
      .withFailureHandler(e => { setBusy(false); setStatus(e.message || String(e), true); })
      [serverFn](id);
  }

  function postAll() {
    if (busy) return;
    failedFilter = null;
    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success || !res.ids || !res.ids.length) { setStatus('Tidak ada draf untuk diposting', true); return; }
        const ids = res.ids, s = res.stats || {}, total = ids.length;
        const body = 'Anda akan memposting ' + total + ' jurnal draf ke Buku Besar. ' +
          'Harap pastikan jurnal-jurnal tersebut telah ditinjau. Jurnal yang telah diposting tidak dapat diubah dan akan memengaruhi saldo Anda.' +
          '\n\n' + total + ' jurnal | Total Rp ' + fmt(s.debit) + ' | ' + (s.review || 0) + ' jurnal tanpa Pelanggan / Pemasok';
        ask('Posting Semua Draf?', body, 'Posting Semua', () => beginPostAllSession(ids), 'Periksa Kembali');
      })
      .withFailureHandler(e => setStatus('Gagal memuat draf: ' + e.message, true))
      .getDraftList(requestDraftList({ idsOnly: true }));
  }

  function beginPostAllSession(ids) {
    google.script.run
      .withSuccessHandler(r => {
        if (!r || !r.success) { setStatus(r && r.message || 'Gagal memulai posting.', true); return; }
        postToken = r.token;
        postTotal = r.total;
        postIds = ids.slice();
        postPosted = [];
        postFailures = [];
        $('stopPost').classList.remove('hidden');
        $('stopPost').disabled = false;
        setBusy(true);
        setStatus('Posting 0/' + postTotal + '...');
        postNextChunk();
      })
      .withFailureHandler(e => setStatus(e.message || String(e), true))
      .beginPostAll(ids);
  }

  function postNextChunk() {
    if (!postToken) return;
    google.script.run
      .withSuccessHandler(r => {
        if (!r || !r.success) {
          setBusy(false);
          $('stopPost').classList.add('hidden');
          setStatus((r && r.message || 'Gagal memposting.') + ' Jalankan Cek Status.', true);
          return;
        }
        postPosted = postPosted.concat(r.postedIds || []);
        postFailures = postFailures.concat(r.failures || []);
        const done = r.progress ? r.progress.done : (postPosted.length + postFailures.length);
        setStatus('Posting ' + done + '/' + postTotal + '...');
        if (r.stopped) {
          setBusy(false);
          $('stopPost').classList.add('hidden');
          setStatus('Dihentikan pada ' + done + '/' + postTotal + '. Jalankan Cek Status.');
          load();
          return;
        }
        if (r.completed || done >= postTotal) {
          setBusy(false);
          $('stopPost').classList.add('hidden');
          postToken = '';
          showPostAllResult(postPosted, postFailures);
          load();
          return;
        }
        setTimeout(postNextChunk, 0);
      })
      .withFailureHandler(e => {
        setBusy(false);
        $('stopPost').classList.add('hidden');
        setStatus((e.message || String(e)) + ' Jalankan Cek Status.', true);
      })
      .postAllChunk(postToken, 50);
  }

  function checkStatus() {
    const ids = postIds.length ? postIds : [];
    google.script.run
      .withSuccessHandler(r => {
        if (!r || !r.success) { setStatus(r && r.message || 'Gagal mengecek status.', true); return; }
        setStatus('Diposting: ' + r.posted + ', Draft: ' + r.draft + ', Campuran: ' + r.mixed + ', Tidak ditemukan: ' + r.missing);
      })
      .withFailureHandler(e => setStatus(e.message || String(e), true))
      .checkPostStatus(ids);
  }

  $('stopPost').addEventListener('click', function () {
    if (!postToken || this.disabled) return;
    this.disabled = true;
    setStatus('Menghentikan...');
    google.script.run
      .withSuccessHandler(() => setStatus('Berhenti setelah batch saat ini.'))
      .withFailureHandler(e => { this.disabled = false; setStatus(e.message || String(e), true); })
      .stopPostAll(postToken);
  });

  function showPostAllResult(posted, failures) {
    if (!failures.length) {
      ask('Posting Semua Selesai', 'Semua ' + posted.length + ' draf berhasil diposting.', 'Tutup', null, 'Tutup', true);
      return;
    }
    const body = 'Posting Semua Selesai: ' + posted.length + ' diposting, ' + failures.length + ' gagal.\n\n' +
      failures.map(f => f.journalNo + ' - ' + f.reason).join('\n');
    ask('Posting Semua Selesai', body, 'Lihat yang Gagal', () => {
      failedFilter = failures.map(f => f.journalNo);
      $('search').value = '';
      page = 1;
      load();
    }, 'Tutup');
  }

  $('body').addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn || busy) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === 'edit') {
      setBusy(true);
      setStatus('Membuka ' + id + '...');
      google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(e => { setBusy(false); setStatus('Gagal membuka draf: ' + e.message, true); })
        .openDraftEditor(id);
    } else if (btn.dataset.act === 'post') {
      const d = drafts.find(x => x.journalId === id) || {};
      const go = () => run('Posting...', 'postDraftFromManagement', id);
      if (d.missingParty) ask('Pelanggan / Pemasok Tidak Diisi', missingPartyBody(d.missingParty, d.missingRows), 'Tetap Posting', go, 'Periksa Kembali');
      else go();
    } else if (btn.dataset.act === 'delete') {
      ask('Hapus ' + id + '?', 'Draf ini akan dihapus secara permanen.', 'Hapus draf',
        () => run('Menghapus...', 'deleteDraft', id));
    }
  });

  function reload() { failedFilter = null; page = 1; load(); }
  $('postAll').addEventListener('click', postAll);
  $('checkStatus').addEventListener('click', checkStatus);
  $('search').addEventListener('input', reload);
  $('startDate').addEventListener('change', reload);
  $('endDate').addEventListener('change', reload);
  $('prevPage').addEventListener('click', () => { if (page > 1) { page--; load(); } });
  $('nextPage').addEventListener('click', () => { if (page < totalPages) { page++; load(); } });
  $('exportExcel').addEventListener('click', function () {
    window.exportReportToExcel({
      type: 'DRAFT_MANAGEMENT',
      search: $('search').value,
      startDate: $('startDate').value,
      endDate: $('endDate').value,
      failedIds: failedFilter || []
    }, this);
  });
  $('refresh').addEventListener('click', reload);
  load();
</script>
</body>
</html>
