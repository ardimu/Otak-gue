<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { padding: 26px; }
    section { max-width: 760px; }
    .eyebrow { color: var(--accent, #3457D5); font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0 0 6px; font-size: 21px; }
    .sub { color: var(--muted, #64748B); margin: 0 0 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="date"] { width: 100%; max-width: 240px; }
    .checkline { display: flex; align-items: center; gap: 9px; margin: 12px 0; }
    .checkline label { margin: 0; font-weight: 400; color: var(--muted, #64748B); }
    .row { display: flex; justify-content: flex-end; margin-top: 20px; }
    button:disabled { opacity: .6; cursor: default; }
    pre {
      white-space: pre-wrap;
      margin: 18px 0 0;
      padding: 14px 16px;
      background: #F8FAFC;
      border: 1px solid var(--rule, #E2E8F0);
      border-radius: 9px;
      min-height: 20px;
      color: var(--ink, #111827);
      font: 12px/1.55 "SFMono-Regular", Consolas, monospace;
    }
    .error { color: var(--danger, #DC2626) !important; }
    [hidden] { display: none !important; }
    .preview { margin-top: 18px; overflow: auto; max-height: 340px; }
    .preview table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .preview th, .preview td { padding: 8px 10px; border-bottom: 1px solid var(--rule, #E2E8F0); text-align: left; white-space: nowrap; }
    .preview th { position: sticky; top: 0; background: #F8FAFC; color: var(--muted, #64748B); font-size: 9.5px; text-transform: uppercase; }
    .preview td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 4px; }
    .hub-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 13px 14px; border: 1px solid var(--rule, #E2E8F0); border-radius: 9px;
      background: #fff; color: var(--ink, #111827); text-align: left; cursor: pointer;
    }
    .hub-card:hover { border-color: var(--accent, #3457D5); background: #F8FAFC; }
    .hub-card b { font-size: 13px; }
    .hub-card span { color: var(--muted, #64748B); font-size: 10.5px; line-height: 1.4; }
  </style>
</head>
<body>
  <section>
    <div class="eyebrow" id="eyebrow"><?= lang === 'ID' ? 'Dashboard' : 'Dashboard' ?></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="fields"></div>
    <div class="row">
      <button class="outline" id="exportExcel" type="button" hidden><?= lang === 'ID' ? 'Ekspor Excel' : 'Export Excel' ?></button>
      <button class="primary" id="run" type="button"></button>
    </div>
    <pre id="out"></pre>
    <div class="preview" id="preview" hidden></div>
  </section>
  <?!= include(lang === 'ID' ? 'scriptId.js' : 'script.js'); ?>
  <script>
    const ACTION = <?!= JSON.stringify(action) ?>;
    const LANG = <?!= JSON.stringify(lang) ?>;
    const $ = id => document.getElementById(id);
    const today = new Date().toISOString().slice(0, 10);
    const T = {
      'stock-movements': {
        en: ['Assets', 'Process Stock Movements Dashboard', 'Reads the Stock Movements sheet and creates draft journals.', 'Process movements'],
        id: ['Aset', 'Dashboard Proses Mutasi Persediaan', 'Membaca lembar Stock Movements dan membuat draf jurnal.', 'Proses mutasi']
      },
      'stock-summary': {
        en: ['Assets', 'Stock Summary Dashboard', 'Generates stock summary as at the chosen date.', 'Generate summary'],
        id: ['Aset', 'Dashboard Ringkasan Persediaan', 'Membuat ringkasan persediaan pada tanggal yang dipilih.', 'Buat ringkasan']
      },
      aging: {
        en: ['Reports', 'AR & AP Aging Dashboard', 'Generates aging and open-items reports as at the chosen date.', 'Generate aging'],
        id: ['Laporan', 'Dashboard Umur Piutang & Utang', 'Membuat laporan umur dan item terbuka pada tanggal yang dipilih.', 'Buat laporan umur']
      },
      'export-hub': {
        en: ['Other Support', 'Export to Excel', 'Choose the report or list you want to export. Filters stay on the destination page.', 'Export'],
        id: ['Dukungan Lain', 'Ekspor ke Excel', 'Pilih laporan atau daftar yang ingin diekspor. Filter tetap di halaman tujuan.', 'Ekspor']
      },
      install: {
        en: ['System', 'Install / Update System Dashboard', 'Creates or updates sheets and default settings.', 'Run install'],
        id: ['Sistem', 'Dashboard Instal / Perbarui Sistem', 'Membuat atau memperbarui lembar dan pengaturan bawaan.', 'Jalankan instalasi']
      },
      check: {
        en: ['System', 'Check COA & Settings Dashboard', 'Diagnoses chart of accounts and required settings.', 'Run check'],
        id: ['Sistem', 'Dashboard Periksa COA & Pengaturan', 'Memeriksa daftar akun dan pengaturan yang diperlukan.', 'Jalankan pemeriksaan']
      }
    };
    const t = (T[ACTION] || T.check)[LANG === 'ID' ? 'id' : 'en'];
    $('eyebrow').textContent = t[0];
    $('title').textContent = t[1];
    $('sub').textContent = t[2];
    $('run').textContent = t[3];

    if (ACTION === 'stock-summary' || ACTION === 'aging') {
      $('fields').innerHTML = '<label for="asOf">' + (LANG === 'ID' ? 'Tanggal acuan (YYYY-MM-DD)' : 'As at (YYYY-MM-DD)') + '</label>' +
        '<input type="date" id="asOf" value="' + today + '">';
    }
    if (ACTION === 'install') {
      $('fields').innerHTML = '<div class="checkline"><input type="checkbox" id="replaceCoa">' +
        '<label for="replaceCoa" style="margin:0;font-weight:400">' +
        (LANG === 'ID' ? 'Ganti COA yang usang (lembar lama dibackup)' : 'Replace an outdated COA (old sheet is backed up)') +
        '</label></div>';
    }
    if (ACTION === 'export-hub') {
      const targets = [
        ['reports-view', 'Financial Report', 'Laporan Keuangan', 'Income statement, balance sheet, equity, cash flow', 'Laba rugi, neraca, ekuitas, arus kas'],
        ['trial-balance', 'Trial Balance', 'Neraca Saldo', 'Trial balance for the active period', 'Neraca saldo periode aktif'],
        ['general-ledger', 'General Ledger', 'Buku Besar', 'Detailed ledger for the active period', 'Buku besar rinci periode aktif'],
        ['reports-aging', 'AR & AP Aging', 'Umur Piutang & Utang', 'Aging as at a chosen date', 'Umur piutang dan utang per tanggal'],
        ['journals', 'Journal List', 'Daftar Jurnal', 'Posted, draft, date and search filters', 'Filter status, tanggal, dan pencarian'],
        ['bank-import', 'Bank & Petty Cash', 'Bank & Kas Kecil', 'Bank rows with account and date filters', 'Baris bank dengan filter akun dan tanggal'],
        ['drafts', 'Draft Management', 'Kelola Draf', 'Draft journals with date and search filters', 'Draf jurnal dengan filter tanggal dan pencarian']
      ];
      const id = LANG === 'ID';
      $('fields').innerHTML = '<p class="sub">' + (id
        ? 'Pilih tujuan, lalu klik tombol Ekspor Excel di halaman tersebut.'
        : 'Choose a destination, then click Export Excel on that page.') + '</p>' +
        '<div class="hub-grid">' + targets.map(row =>
          '<button class="hub-card" type="button" data-page="' + row[0] + '" data-label="' + esc(id ? row[2] : row[1]) + '">' +
          '<b>' + esc(id ? row[2] : row[1]) + '</b><span>' + esc(id ? row[4] : row[3]) + '</span></button>'
        ).join('') + '</div>';
      $('run').hidden = true;
      $('fields').addEventListener('click', event => {
        const card = event.target.closest && event.target.closest('.hub-card');
        if (!card) return;
        const key = card.getAttribute('data-page');
        const label = card.getAttribute('data-label');
        if (window.webGoPage) window.webGoPage(key, label);
        else if (window.parent && window.parent.webNavigate) window.parent.webNavigate(key, label);
        else window.location.href = '?page=' + encodeURIComponent(key);
      });
    }

    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderAgingPreview(result) {
      const headers = result.headers || [];
      const rows = result.rows || [];
      $('preview').hidden = false;
      if (!rows.length) {
        $('preview').innerHTML = LANG === 'ID' ? 'Tidak ada data umur piutang dan utang.' : 'No aging data to display.';
        return;
      }
      let html = '<table><thead><tr>' + headers.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(row => {
        html += '<tr>' + headers.map((h, i) => {
          const value = row[i];
          const cls = typeof value === 'number' ? ' class="num"' : '';
          return '<td' + cls + '>' + esc(value) + '</td>';
        }).join('') + '</tr>';
      });
      $('preview').innerHTML = html + '</tbody></table>';
    }

    function refreshAgingPreview() {
      window.exportReportToExcel({ type: 'AGING', asOf: $('asOf').value }, null, {
        onData: renderAgingPreview,
        onError: message => {
          $('preview').hidden = false;
          $('preview').textContent = message;
        }
      });
    }

    if (ACTION === 'aging') {
      $('exportExcel').hidden = false;
      $('asOf').addEventListener('change', refreshAgingPreview);
      refreshAgingPreview();
    }

    function downloadFile(result) {
      const bytes = atob(result.data);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const blob = new Blob([arr], { type: result.mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = result.fileName || 'export'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function show(result) {
      $('run').disabled = false;
      $('out').className = '';
      if (result && result.data && result.fileName) {
        downloadFile(result);
        $('out').textContent = (LANG === 'ID' ? 'File diunduh: ' : 'Downloaded: ') + result.fileName;
        return;
      }
      if (result && Array.isArray(result.issues)) {
        $('out').textContent = result.issues.length
          ? result.issues.join('\n')
          : (LANG === 'ID' ? 'Pemeriksaan lolos. Tidak ada masalah.' : 'Check passed. No issues found.');
        return;
      }
      if (result && result.success === false) {
        $('out').className = 'error';
        $('out').textContent = result.message || String(result);
        return;
      }
      $('out').textContent = result && result.message ? result.message : (LANG === 'ID' ? 'Selesai.' : 'Done.');
    }

    function fail(error) {
      $('run').disabled = false;
      $('out').className = 'error';
      $('out').textContent = error && error.message ? error.message : String(error);
    }

    function call(name, arg) {
      $('run').disabled = true;
      $('out').textContent = LANG === 'ID' ? 'Memproses...' : 'Working...';
      const runner = google.script.run.withSuccessHandler(show).withFailureHandler(fail);
      if (arg === undefined) runner[name](); else runner[name](arg);
    }

    $('exportExcel').addEventListener('click', function () {
      if (ACTION !== 'aging') return;
      window.exportReportToExcel({ type: 'AGING', asOf: $('asOf').value }, this);
    });

    $('run').addEventListener('click', function () {
      if (ACTION === 'stock-movements') call('webProcessStockMovements');
      else if (ACTION === 'stock-summary') call('webGenerateStockSummary', $('asOf').value);
       else if (ACTION === 'aging') call('webGenerateAging', $('asOf').value);
       else if (ACTION === 'install') call('webInstallSystem', { replaceCoa: $('replaceCoa').checked });
      else call('webRunSetupCheck');
    });
  </script>
</body>
</html>
