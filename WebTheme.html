<style>
:root {
  --paper: #F4F6FA;
  --sheet: #FFFFFF;
  --ink: #111827;
  --muted: #64748B;
  --rule: #E2E8F0;
  --rule-strong: #CBD5E1;
  --accent: #3457D5;
  --accent-strong: #233E9E;
  --accent-soft: #EEF2FF;
  --danger: #DC2626;
  --danger-soft: #FEF2F2;
  --warn: #B45309;
  --warn-soft: #FFFBEB;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper) !important;
  color: var(--ink) !important;
  font-family: Inter, "Segoe UI", Arial, sans-serif !important;
  font-size: 13px;
}
h1, h2, h3, h4 { color: var(--ink); letter-spacing: -.015em; }
a { color: var(--accent); }

input, select, textarea {
  border: 1px solid var(--rule-strong) !important;
  border-radius: 8px !important;
  padding: 9px 10px !important;
  background: #fff !important;
  color: var(--ink) !important;
  font: inherit !important;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid rgba(52, 87, 213, .22) !important;
  outline-offset: 1px !important;
  border-color: var(--accent) !important;
}
input[type="checkbox"], input[type="radio"] { width: auto !important; padding: 0 !important; }

button:not(.link) {
  border: 1px solid transparent !important;
  border-radius: 8px !important;
  padding: 9px 14px !important;
  font: inherit !important;
  font-weight: 600 !important;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
button:not(.link):hover { transform: translateY(-1px); }
button.primary, button.post { background: var(--accent) !important; color: #fff !important; }
button.primary:hover, button.post:hover { background: var(--accent-strong) !important; }
button.secondary, button.quiet, button.ghost, button.outline, button.edit {
  background: #fff !important;
  border-color: var(--rule-strong) !important;
  color: var(--ink) !important;
}
button.edit { border-color: var(--accent) !important; color: var(--accent) !important; }
button.danger { background: var(--danger) !important; color: #fff !important; }
button.link {
  background: transparent !important;
  border: 0 !important;
  color: var(--accent) !important;
  padding: 4px 8px !important;
  font-weight: 600 !important;
  cursor: pointer;
}
button:disabled { opacity: .6; transform: none !important; }

section, .panel, .card, .dialog, .modal, .list, .choices, .wrap {
  background: var(--sheet) !important;
  border: 1px solid var(--rule) !important;
  border-radius: 12px !important;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px rgba(15, 23, 42, .04) !important;
}
.divider, hr { border-color: var(--rule) !important; }

table { border-collapse: separate !important; border-spacing: 0 !important; width: 100%; }
th, td { border-bottom: 1px solid var(--rule) !important; padding: 10px 12px !important; }
th {
  background: #F8FAFC !important;
  color: var(--muted) !important;
  font-size: 10.5px !important;
  font-weight: 700 !important;
  letter-spacing: .07em !important;
  text-transform: uppercase !important;
}
tbody tr:hover td { background: #FAFBFF !important; }

.pill, .tag {
  border-radius: 999px !important;
  padding: 3px 9px !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  background: var(--accent-soft) !important;
  color: var(--accent) !important;
}
.pill.off { background: #F1F5F9 !important; color: var(--muted) !important; }
.tag.practice { background: var(--warn-soft) !important; color: var(--warn) !important; }
.tag.live, .tag.new { background: var(--accent-soft) !important; color: var(--accent) !important; }

.callout { border-left: 4px solid var(--warn) !important; background: var(--warn-soft) !important; }
.callout.good { border-left-color: var(--accent) !important; background: var(--accent-soft) !important; }
.callout.danger { border-left-color: var(--danger) !important; background: var(--danger-soft) !important; }
.callout.info { border-left-color: var(--accent) !important; background: var(--accent-soft) !important; color: var(--accent) !important; border-color: #D8E0FF !important; }

.status.ok, #message.success { color: var(--accent) !important; }
.warn, .error, .text-danger { color: var(--danger) !important; }

/* Web-only polish for shared legacy dialog pages */
.hidden, [hidden] { display: none !important; }
.sheet { background: var(--paper) !important; color: var(--ink) !important; min-height: 100vh; }
.overlay { background: rgba(15, 23, 42, .46) !important; backdrop-filter: blur(2px); }
.foot {
  position: sticky;
  bottom: 0;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 0 0 !important;
  background: linear-gradient(to top, var(--paper) 72%, transparent);
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
label { color: var(--ink) !important; }
.eyebrow, .kicker {
  color: var(--accent) !important;
  font-size: 10px !important;
  font-weight: 800 !important;
  letter-spacing: .14em !important;
  text-transform: uppercase !important;
}
.sub, .muted { color: var(--muted) !important; }
pre {
  white-space: pre-wrap !important;
  overflow-wrap: anywhere;
  padding: 14px 16px !important;
  background: #F8FAFC !important;
  border: 1px solid var(--rule) !important;
  border-radius: 10px !important;
  color: var(--ink) !important;
  font: 12px/1.55 "SFMono-Regular", Consolas, monospace !important;
}

/* Web App shell */
.web-app { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.web-top { position: relative; z-index: 100; flex: 0 0 auto; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.web-accent {
  flex: 0 0 7px;
  height: 7px;
  background: linear-gradient(90deg, #3457D5 0%, #7C3AED 52%, #B45309 100%);
  border-radius: 0 0 50% 50% / 0 0 8px 8px;
  box-shadow: 0 3px 10px rgba(52, 87, 213, .18);
}
.web-top-row {
  height: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
}
.web-brand { display: flex; align-items: center; gap: 10px; }
.web-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
}
.web-brand-text strong { display: block; font-size: 13px; line-height: 1.1; }
.web-brand-text span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; letter-spacing: .14em; }
.web-company {
  color: var(--muted);
  font-size: 12px;
  padding-left: 16px;
  border-left: 1px solid var(--rule);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.web-search {
  margin-left: auto;
  min-width: 210px;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: #F8FAFC;
  color: var(--muted);
  font-size: 12px;
}
.web-top-actions { display: flex; align-items: center; gap: 10px; }
.web-mode {
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .05em;
  white-space: nowrap;
}
.web-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
}
.web-lang { display: flex; gap: 5px; }
.web-lang button {
  border: 1px solid var(--rule) !important;
  background: #fff !important;
  color: var(--muted) !important;
  border-radius: 7px !important;
  padding: 7px 9px !important;
  font-size: 11px !important;
}
.web-lang button.active { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }

.web-menubar {
  height: 44px;
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 0 16px;
  background: var(--sheet);
  overflow: visible;
}
.web-menu-toggle {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.web-menu-home, .web-menu-label {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 44px;
  padding: 0 16px !important;
  color: var(--ink) !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.web-home-mark { width: 6px; height: 6px; border-radius: 2px; background: var(--accent); opacity: .8; }
.web-menu-home:hover, .web-menu-label:hover,
.web-menu-toggle:checked + .web-menu-label, .web-menu.active > .web-menu-label {
  color: var(--accent) !important;
  background: var(--accent-soft) !important;
}
.web-menu-home.active { color: var(--accent) !important; background: var(--accent-soft) !important; }
.web-caret { color: var(--muted); font-size: 10px; transition: transform .18s ease; }
.web-menu-toggle:checked + .web-menu-label .web-caret { transform: rotate(90deg); }
.web-menu { position: relative; display: flex; align-items: stretch; }
.web-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 110;
  min-width: 250px;
  padding: 8px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 11px;
  box-shadow: 0 18px 42px rgba(15, 23, 42, .16);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px) scale(.98);
  transform-origin: top left;
  transition: opacity .16s ease, transform .16s ease, visibility .16s;
  pointer-events: none;
}
.web-menu-toggle:checked ~ .web-dropdown,
.web-menu:hover > .web-dropdown,
.web-menu:focus-within > .web-dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.web-flyout { position: relative; }
.web-flyout-label {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px; border-radius: 7px; color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: default;
}
.web-flyout:hover > .web-flyout-label, .web-flyout:focus-within > .web-flyout-label { background: #F5F7FF; color: var(--accent); }
.web-flyout-arrow { color: var(--muted); font-size: 12px; }
.web-submenu {
  position: absolute; top: -8px; left: 100%; margin-left: 8px; min-width: 280px; padding: 8px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 11px;
  box-shadow: 0 18px 42px rgba(15, 23, 42, .16);
  opacity: 0; visibility: hidden; transform: translateX(-8px); transition: opacity .16s ease, transform .16s ease, visibility .16s;
  pointer-events: none;
}
.web-flyout:hover > .web-submenu, .web-flyout:focus-within > .web-submenu {
  opacity: 1; visibility: visible; transform: translateX(0); pointer-events: auto;
}
.web-dropdown-title {
  padding: 8px 10px 5px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.web-dropdown-sections { min-width: 290px; padding: 10px; }
.web-dropdown-sep { height: 1px; margin: 8px 6px; background: var(--rule); }
.web-dropdown a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  color: var(--ink);
  font-size: 12.5px;
  text-decoration: none;
}
.web-dropdown a:hover { background: #F5F7FF; color: var(--accent); }
.web-dropdown a.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.web-icon {
  width: 25px;
  height: 25px;
  flex: 0 0 25px;
  border-radius: 6px;
  background: #F1F5F9;
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
}
.web-dropdown a.active .web-icon, .web-dropdown a:hover .web-icon {
  background: var(--accent);
  color: #fff;
}
.web-main { flex: 1 1 auto; min-height: 0; background: var(--paper); }
.web-main iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
[hidden] { display: none !important; }
.web-modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; }
.web-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .45); backdrop-filter: blur(2px); }
.web-modal-card {
  position: relative;
  width: min(1000px, 94vw);
  height: min(780px, 90vh);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(15, 23, 42, .3);
  animation: web-modal-in .18s ease both;
}
.web-modal-head {
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 0 20px;
  border-bottom: 1px solid var(--rule);
  color: var(--ink);
  font-size: 13px;
}
.web-modal-close {
  width: 32px;
  height: 32px;
  border: 0 !important;
  border-radius: 8px;
  background: transparent !important;
  color: var(--muted) !important;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.web-modal-close:hover { background: #F1F5F9 !important; color: var(--ink) !important; }
.web-modal-card iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--paper); }
@keyframes web-modal-in {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 900px) {
  .web-company, .web-search { display: none; }
  .web-top-row { padding: 0 14px; }
  .web-modal-card { width: 96vw; height: 94vh; }
}
</style>
