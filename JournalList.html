<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; padding:26px; background:var(--paper,#F4F6FA); color:var(--ink,#172033); }
    .head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .eyebrow { color:var(--accent,#3457D5); font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:6px 0 4px; font-size:24px; }
    .sub { margin:0; color:var(--muted,#64748B); font-size:12.5px; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .report-shortcuts { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; }
    .rs { display:inline-flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px; border:1px solid var(--rule,#E2E8F0); background:#fff; color:var(--ink,#172033); text-decoration:none; font-size:12px; font-weight:600; box-shadow:0 4px 14px rgba(15,23,42,.03); }
    .rs:hover { border-color:var(--accent,#3457D5); color:var(--accent,#3457D5); }
    .rs .dot { width:24px; height:24px; border-radius:7px; background:var(--accent-soft,#EEF2FF); color:var(--accent,#3457D5); display:grid; place-items:center; font-size:9px; font-weight:800; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:8px; border:1px solid var(--rule,#E2E8F0); background:#fff; color:var(--ink,#172033); font:inherit; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }
    .btn.primary { background:var(--accent,#3457D5); color:#fff; border-color:var(--accent,#3457D5); }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
    .stat { background:#fff; border:1px solid var(--rule,#E2E8F0); border-radius:12px; padding:14px 16px; box-shadow:0 8px 24px rgba(15,23,42,.04); }
    .stat span { display:block; color:var(--muted,#64748B); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .stat strong { display:block; margin-top:6px; font-size:22px; font-variant-numeric:tabular-nums; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .toolbar input,.toolbar select { height:36px; padding:0 10px; border:1px solid var(--rule,#E2E8F0); border-radius:8px; background:#fff; font:inherit; font-size:12px; }
    .toolbar input { min-width:260px; }
    .count { margin-left:auto; color:var(--muted,#64748B); font-size:11px; }
    .card { background:#fff; border:1px solid var(--rule,#E2E8F0); border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.04); }
    .scroll { overflow:auto; max-height:62vh; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { position:sticky; top:0; background:#F8FAFC; padding:10px 12px; text-align:left; font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted,#64748B); border-bottom:1px solid var(--rule,#E2E8F0); white-space:nowrap; }
    td { padding:10px 12px; border-bottom:1px solid #F1F5F9; vertical-align:middle; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    tr:hover td { background:#FAFBFF; }
    tr.hl td { background:var(--accent-soft,#EEF2FF); }
    .id { color:var(--accent,#3457D5); font-weight:700; }
    .meta { display:block; color:var(--muted,#64748B); font-size:10.5px; margin-top:2px; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; font-size:10px; font-weight:700; background:#DCFCE7; color:#166534; }
    .pill.draft { background:#FEF3C7; color:#92400E; }
    .empty,.loading { padding:40px 20px; text-align:center; color:var(--muted,#64748B); }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <div class="eyebrow"><?= lang === 'ID' ? 'Transaksi & Input' : 'Transactions & Input' ?></div>
      <h1><?= lang === 'ID' ? 'Dashboard Daftar Jurnal' : 'Journal List Dashboard' ?></h1>
      <p class="sub"><?= lang === 'ID' ? 'Pantau semua jurnal draft dan posted, lalu buat jurnal baru dari sini.' : 'Monitor all draft and posted journals, and create new entries from here.' ?></p>
    </div>
    <div class="actions">
      <button class="btn" id="refreshBtn"><?= lang === 'ID' ? 'Muat ulang' : 'Refresh' ?></button>
      <a class="btn primary" href="?page=journal-new" data-modal="1" data-page="journal-new" data-label="<?= lang === 'ID' ? 'Jurnal Baru' : 'New Journal Entry' ?>"><?= lang === 'ID' ? '+ Jurnal Baru' : '+ New Journal Entry' ?></a>
    </div>
  </div>
  <div class="report-shortcuts">
    <a class="rs" href="?page=reports-view&keys=bs"><span class="dot">BS</span><span><?= lang === 'ID' ? 'Neraca' : 'Balance Sheet' ?></span></a>
    <a class="rs" href="?page=reports-view&keys=is"><span class="dot">IS</span><span><?= lang === 'ID' ? 'Laba Rugi' : 'Income Statement' ?></span></a>
    <a class="rs" href="?page=reports-view&keys=eq"><span class="dot">EQ</span><span><?= lang === 'ID' ? 'Perubahan Ekuitas' : 'Equity Changes' ?></span></a>
    <a class="rs" href="?page=reports-view&keys=cf"><span class="dot">CF</span><span><?= lang === 'ID' ? 'Arus Kas' : 'Cash Flow' ?></span></a>
  </div>

  <div class="stats">
    <div class="stat"><span><?= lang === 'ID' ? 'Total Jurnal' : 'Total Journals' ?></span><strong id="sTotal">0</strong></div>
    <div class="stat"><span>Posted</span><strong id="sPosted">0</strong></div>
    <div class="stat"><span>Draft</span><strong id="sDraft">0</strong></div>
    <div class="stat"><span><?= lang === 'ID' ? 'Total Nilai' : 'Total Value' ?></span><strong id="sValue">0</strong></div>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="<?= lang === 'ID' ? 'Cari ID, keterangan, referensi, pihak…' : 'Search ID, description, reference, party…' ?>">
    <select id="status"><option value="ALL"><?= lang === 'ID' ? 'Semua status' : 'All statuses' ?></option><option value="POSTED">Posted</option><option value="DRAFT">Draft</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="card"><div class="scroll" id="body"><div class="loading"><?= lang === 'ID' ? 'Memuat jurnal…' : 'Loading journals…' ?></div></div></div>

  <script>
    const LANG = <?!= JSON.stringify(lang) ?>;
    const HIGHLIGHT = <?!= JSON.stringify(String(typeof params === 'undefined' ? '' : (params.highlight || ''))) ?>;
    const $ = id => document.getElementById(id);
    let items = [];
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const fmt = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    function renderStats() {
      const posted = items.filter(i=>i.status==='POSTED');
      const draft = items.filter(i=>i.status==='DRAFT');
      $('sTotal').textContent = items.length;
      $('sPosted').textContent = posted.length;
      $('sDraft').textContent = draft.length;
      $('sValue').textContent = fmt(items.reduce((s,i)=>s+(Number(i.debit)||0),0));
    }
    function visible() {
      const term = $('q').value.trim().toLowerCase();
      const st = $('status').value;
      return items.filter(i => {
        if (st !== 'ALL' && i.status !== st) return false;
        if (!term) return true;
        return [i.journalId,i.journalType,i.description,i.reference,i.party].some(v=>String(v||'').toLowerCase().includes(term));
      });
    }
    function render() {
      const rows = visible();
      $('count').textContent = rows.length + ' / ' + items.length;
      if (!rows.length) { $('body').innerHTML = '<div class="empty">' + (LANG==='ID'?'Tidak ada jurnal yang cocok.':'No matching journals.') + '</div>'; return; }
      let html = '<table><thead><tr><th>'+(LANG==='ID'?'ID & Jenis':'ID & Type')+'</th><th>'+(LANG==='ID'?'Tanggal':'Date')+'</th><th>'+(LANG==='ID'?'Keterangan':'Description')+'</th><th>'+(LANG==='ID'?'Pihak':'Party')+'</th><th>Status</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">'+(LANG==='ID'?'Baris':'Lines')+'</th></tr></thead><tbody>';
      rows.forEach(i => {
        html += '<tr'+(i.journalId===HIGHLIGHT?' class="hl"':'')+'>' +
          '<td><span class="id">'+esc(i.journalId)+'</span><span class="meta">'+esc(i.journalType||'')+'</span></td>' +
          '<td>'+esc(i.date||'')+'<span class="meta">'+esc(i.postedAt||i.updatedAt||'')+'</span></td>' +
          '<td>'+esc(i.description||'')+(i.reference?'<span class="meta">'+esc(i.reference)+'</span>':'')+'</td>' +
          '<td>'+esc(i.party||'')+'</td>' +
          '<td><span class="pill '+(i.status==='DRAFT'?'draft':'')+'">'+esc(i.status)+'</span></td>' +
          '<td class="num">'+fmt(i.debit)+'</td><td class="num">'+fmt(i.credit)+'</td><td class="num">'+esc(i.lineCount||0)+'</td></tr>';
      });
      $('body').innerHTML = html + '</tbody></table>';
    }
    function load() {
      $('body').innerHTML = '<div class="loading">'+(LANG==='ID'?'Memuat jurnal…':'Loading journals…')+'</div>';
      google.script.run.withSuccessHandler(res => {
        if (!res || !res.success) { $('body').innerHTML = '<div class="empty">'+esc(res&&res.message||'Error')+'</div>'; return; }
        items = res.journals || []; renderStats(); render();
      }).withFailureHandler(err => { $('body').innerHTML = '<div class="empty">'+esc(err&&err.message||err)+'</div>'; }).webListJournals({status:'ALL',limit:500});
    }
    $('q').addEventListener('input', render);
    $('status').addEventListener('change', render);
    $('refreshBtn').addEventListener('click', load);
    document.addEventListener('click', function(e){
      const a = e.target.closest('a[data-modal]');
      if (a && window.parent && window.parent.webOpenModal) { e.preventDefault(); window.parent.webOpenModal(a.getAttribute('data-page'), a.getAttribute('data-label')); }
    });
    load();
  </script>
</body>
</html>
